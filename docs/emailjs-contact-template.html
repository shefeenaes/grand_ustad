<!--
  EmailJS template for the website "Contact us" form.
  Paste everything below this comment into EmailJS > Email Templates > (your template) > Content (switch the editor to "Code").

  Template settings to use:
    Subject:    New enquiry from {{name}} | {{site_name}} website
    To Email:   grandustadrestaurant@gmail.com
    From Name:  {{site_name}} Website
    Reply To:   {{email}}

  Variables sent by the site: name, email, phone, message, time, site_name

  The logo loads from the live site (public/images/GU_logo.png), so keep that file deployed.
-->
<div style="margin:0;padding:24px 12px;background:#f7f7f4;font-family:Arial,Helvetica,sans-serif;color:#1a1b22;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;margin:0 auto;background:#ffffff;border:1px solid #e6e6e1;border-radius:16px;overflow:hidden;">
    <tr>
      <td style="height:6px;background:#324a48;font-size:0;line-height:0;">&nbsp;</td>
    </tr>
    <tr>
      <td style="padding:28px 32px 8px;">
        <img src="https://www.grandustad.com/images/GU_logo.png" alt="{{site_name}}" width="180" style="display:block;width:180px;max-width:100%;height:auto;margin:0 0 24px;border:0;">
        <p style="margin:0 0 6px;font-size:12px;font-weight:bold;letter-spacing:2px;text-transform:uppercase;color:#324a48;">New website enquiry</p>
        <h1 style="margin:0;font-size:24px;line-height:1.3;color:#1a1b22;">{{name}} sent you a message</h1>
        <p style="margin:8px 0 0;font-size:14px;color:#4f5260;">Received {{time}} (UAE time)</p>
      </td>
    </tr>
    <tr>
      <td style="padding:20px 32px 8px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="font-size:15px;">
          <tr>
            <td style="padding:10px 0;width:90px;color:#4f5260;border-bottom:1px solid #eeeeea;">Name</td>
            <td style="padding:10px 0;font-weight:bold;border-bottom:1px solid #eeeeea;">{{name}}</td>
          </tr>
          <tr>
            <td style="padding:10px 0;color:#4f5260;border-bottom:1px solid #eeeeea;">Email</td>
            <td style="padding:10px 0;border-bottom:1px solid #eeeeea;"><a href="mailto:{{email}}" style="color:#1a1b22;font-weight:bold;">{{email}}</a></td>
          </tr>
          <tr>
            <td style="padding:10px 0;color:#4f5260;">Phone</td>
            <td style="padding:10px 0;font-weight:bold;">{{phone}}</td>
          </tr>
        </table>
      </td>
    </tr>
    <tr>
      <td style="padding:16px 32px 8px;">
        <p style="margin:0 0 8px;font-size:13px;font-weight:bold;letter-spacing:1px;text-transform:uppercase;color:#4f5260;">Message</p>
        <div style="padding:16px 18px;background:#f7f7f4;border-left:4px solid #324a48;border-radius:8px;font-size:15px;line-height:1.6;white-space:pre-wrap;">{{message}}</div>
      </td>
    </tr>
    <tr>
      <td style="padding:20px 32px 28px;">
        <a href="mailto:{{email}}" style="display:inline-block;padding:12px 24px;background:#324a48;color:#ffffff;font-weight:bold;font-size:15px;text-decoration:none;border-radius:999px;">Reply to {{name}}</a>
      </td>
    </tr>
    <tr>
      <td style="padding:16px 32px;background:#0b2a1f;color:#e9deca;font-size:12px;line-height:1.5;">
        Sent from the contact form on the {{site_name}} website. Replying to this email goes straight to the sender.
      </td>
    </tr>
  </table>
</div>
